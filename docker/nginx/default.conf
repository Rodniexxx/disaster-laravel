server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /var/www/html/public;
    index index.php;

    charset utf-8;

    # Admin uploads MANGNO game builds (.exe / .msi / .zip / .apk).
    # Kept in sync with PHP upload_max_filesize/post_max_size (512 MB).
    client_max_body_size 512M;
    client_body_buffer_size 16m;

    access_log /var/log/nginx/mangno.access.log;
    error_log  /var/log/nginx/mangno.error.log warn;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # Deny access to hidden files (.env, .git, .htaccess, ...).
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Long-lived caching for built static assets.
    location ~* \.(?:css|js|mjs|map|jpg|jpeg|gif|png|ico|webp|svg|woff2?|ttf|eot|otf)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # Deny direct access to source / config files that can leak data.
    location ~* \.(?:ini|log|md|yml|yaml|lock|sql|env|bak|old|orig|dist|conf)$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # Laravel front controller routing.
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Pass PHP requests to the PHP-FPM service (internal Docker network only).
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_connect_timeout 60s;
        fastcgi_send_timeout 300s;
        fastcgi_read_timeout 300s;
        fastcgi_buffer_size 32k;
        fastcgi_buffers 16 32k;
        fastcgi_busy_buffers_size 64k;
    }
}
