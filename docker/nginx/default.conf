
server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /var/www/html/public;
    index index.php;

    charset utf-8;

    # Allow large uploads for game builds.
    client_max_body_size 512M;
    client_body_buffer_size 16m;

    access_log /var/log/nginx/mangno.access.log;
    error_log /var/log/nginx/mangno.error.log warn;

    # Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;

    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # Deny hidden files, including .env and .git.
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Deny direct access to sensitive files.
    location ~* \.(?:ini|log|md|yml|yaml|lock|sql|env|bak|old|orig|dist|conf)$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Cache built frontend assets.
    location ~* \.(?:css|js|mjs|jpg|jpeg|gif|png|ico|webp|svg|woff2?|ttf|eot|otf)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    location = /favicon.ico {
        access_log off;
        log_not_found off;
    }

    location = /robots.txt {
        access_log off;
        log_not_found off;
    }

    # Laravel routing.
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP-FPM: forward requests to the app service.
    location ~ \.php$ {
        try_files $uri =404;

        include fastcgi_params;
        fastcgi_pass app:9000;
        fastcgi_index index.php;

        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $document_root;

        fastcgi_connect_timeout 60s;
        fastcgi_send_timeout 300s;
        fastcgi_read_timeout 300s;

        fastcgi_buffer_size 32k;
        fastcgi_buffers 16 32k;
        fastcgi_busy_buffers_size 64k;
    }
}
