; MANGNO production PHP settings.
; Upload ceiling matches config/mangno.php max_upload_kb (2097152 KB = 2 GiB).
; Each release form sends one build; allow 64 MiB for multipart/form overhead.
; so admins can upload .exe / .msi / .zip / .apk game builds.

upload_max_filesize = 2G
post_max_size = 2112M
memory_limit = 512M
max_execution_time = 3600
max_input_time = 3600

; OPcache is tuned for an immutable image (code does not change at runtime).
opcache.enable = 1
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
opcache.save_comments = 1
opcache.fast_shutdown = 1

; Real path cache
realpath_cache_size = 4096K
realpath_cache_ttl = 600

expose_php = Off
